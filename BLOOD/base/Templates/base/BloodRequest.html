{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="d-flex flex-column flex-lg-row vh-100">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark flex-lg-column side-navbar p-3">
            <a class="navbar-brand navbar-brand-custom mb-4" href="#">Patient-Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav flex-column text-center">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{% url 'patient_home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blood_request' %}">Request for Blood</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blood_request_view'%}">View Status</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'patient_feedback'%}">Feedback</a>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="container p-4">
            <div class="form-container">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="patient-name" class="form-label">Username:</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Enter Patient-name">
                    </div>
                    <div class="mb-3">
                        <label for="blood_group" class="form-label">Select Blood Group:</label>
                        <select name="blood_group" id="blood_group" class="form-select">
                            <option value="">Select</option>
                            <option value="A+" {% if blood_group == "A+" %}selected{% endif %}>A+</option>
                            <option value="A-" {% if blood_group == "A-" %}selected{% endif %}>A-</option>
                            <option value="B+" {% if blood_group == "B+" %}selected{% endif %}>B+</option>
                            <option value="B-" {% if blood_group == "B-" %}selected{% endif %}>B-</option>
                            <option value="AB+" {% if blood_group == "AB+" %}selected{% endif %}>AB+</option>
                            <option value="AB-" {% if blood_group == "AB-" %}selected{% endif %}>AB-</option>
                            <option value="O+" {% if blood_group == "O+" %}selected{% endif %}>O+</option>
                            <option value="O-" {% if blood_group == "O-" %}selected{% endif %}>O-</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="unit" class="form-label" >Unit:</label>
                        <input type="number" id="unit" min="1" max="5"  name="unit" class="form-control" placeholder="Enter Units Required">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description:</label>
                        <textarea id="description" name="description" class="form-control" placeholder="Enter Description"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="hospital" class="form-label">Hospital Name:</label>
                        <input type="text" id="hospital" name="hospital" class="form-control" placeholder="Enter Hospital Name">
                    </div>
                    <div class="mb-3">
                        <label for="needed_date_time" class="form-label">Needed Date and Time:</label>
                        <input type="datetime-local" id="needed_date_time" name="needed_date_time" class="form-control">
                    </div>
                    <button type="button" id="btn1" name="btn1" class="btn btn-primary btn-lg">Request</button>  <!-- Increased button size and made it larger -->
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        $('#btn1').click(()=>{
            var username =$('#username').val()
            var blood_group=$('#blood_group').val()
            var description=$('#description').val()
            var unit=$('#unit').val()
            var hospital=$('#hospital').val()
            var needed_date_time=$('#needed_date_time').val()


            var data={
                'csrfmiddlewaretoken':'{{csrf_token}}',
                'username':username,
                'blood_group':blood_group,
                'description':description,
                'unit':unit,
                'hospital':hospital,
                'needed_date_time':needed_date_time
            };
            console.log(data)

            if(username === ""){
                alert('Enter username')
                return;
            }
            if(blood_group === ""){
                alert("blood_group field is required")
                return
            }
            if(description === ""){
                alert('description field is required')
            }
            if(unit === ""){
                alert('Alert field is required')
                return
            }
            if (unit < 1 ) {
                alert('min 1 unit requred');
                return;
            }
            if (unit > 5){
                alert('you can only request for 5 unit max')
                return
            }
            if(hospital === ""){
                alert("hospital field is required")
                return
            }
            if(needed_date_time ===""){
                alert("needed_date_time field is required")
                return
            }else{
                $.ajax({
                    url:'{% url "blood_request" %}',
                    method:"POST",
                    data:data,
                    dataType:"json",
                    success:function(data){
                        if(data.success){
                            alert('blood_request posted successfully done');
                            window.location.replace("{% url 'patient_home'%}");
                        }else{
                            alert('An error occured')
                        }
                    }
                })
            }
            
        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
