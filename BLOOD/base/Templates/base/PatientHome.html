{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static "css/patienthome.css" %}">
</head>
<body>
    <div class="d-flex flex-column flex-lg-row vh-100">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark flex-lg-column side-navbar p-3">
            <a class="navbar-brand navbar-brand-custom mb-4" href="#">Patient-Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav flex-column text-center">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{% url "patient_home" %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blood_request'%}">Request for blood</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'blood_request_view'%}">View status</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'patient_feedback'%}">Feedback</a>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="content p-4 flex-grow-1 d-flex flex-column align-items-center justify-content-center">
            <h1 class="text-center mb-4">Patient Home Page</h1>
            <hr>
            <div class="divtable-view text-center">
                <h2 class="welcome-message">Welcome, {{ patient.username }}!</h2>
            </div>
            <a href="{% url 'patient_logout' %}" class="btn btn-primary mt-4">Logout</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
