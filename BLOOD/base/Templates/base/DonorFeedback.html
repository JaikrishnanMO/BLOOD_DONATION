{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="{% static 'css/feedback.css' %}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <a href="{% url 'donor_home' %}">
        <button class="btn btn-light">Back</button>
    </a>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Feedback</h2>
        <form id="feedback-form" method="POST" class="feedback-form">
            {% csrf_token %}
            <div class="mb-3">
                <label for="feedback" class="form-label">Feedback:</label>
                <textarea class="form-control" name="feedback" id="feedback" placeholder="Enter Feedback" rows="5" required></textarea>
            </div>
            <button type="submit" id="btn1" class="btn btn-primary w-100">Submit</button>
        </form>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        $(document).ready(function() {
            $('#feedback-form').on('submit', function(event) {
                event.preventDefault();
    
                var feedback = $('#feedback').val();
    
                if (feedback === "") {
                    alert("Enter feedback");
                    return;
                }
    
                var data = {
                    'csrfmiddlewaretoken': '{{ csrf_token }}',
                    'feedback': feedback
                };
    
                $.ajax({
                    url: '{% url "donor_feedback" %}',
                    method: 'POST',
                    data: data,
                    dataType: 'json',
                    success: function(response) {
                        console.log('Success response:', response);
                        if (response.success) {
                            alert("Feedback submitted successfully");
                            location.reload();
                        } else {
                            alert('An error occurred: ' + response.message);
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('AJAX Error:', error);
                        alert('An error occurred. Please try again.');
                    }
                });
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
