<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accepted Donor Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Accepted Donor Details</h2>
        <div class="card">
            <div class="card-body">
                {% if accepted_details %}
                    <ul class="list-group">
                        {% for detail in accepted_details %}
                            <li class="list-group-item">
                                <strong>Donor Name:</strong> {{ detail.donor_name }}<br>
                                <strong>Donor Phone:</strong> {{ detail.donor_phone }}<br>
                                <strong>Accepted Unit:</strong> {{ detail.accepted_unit }}
                            </li>
                        {% endfor %}
                    </ul>
                {% else %}
                    <p>No details available.</p>
                {% endif %}
            </div>
        </div>
        <a href="{% url 'blood_request_view' %}" class="btn btn-secondary mt-3">Back</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
