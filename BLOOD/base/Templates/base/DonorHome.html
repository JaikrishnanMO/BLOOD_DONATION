{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/donorhome.css' %}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3 d-flex flex-column align-items-center">
                    <h2 class="sidebar-heading text-center my-4">Donor Home</h2>
                    <ul class="nav flex-column text-center mt-custom">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="{% url 'donor_home'%}"><i class="bi bi-house-door-fill"></i> Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'view_donations'%}"><i class="bi bi-person-fill"></i> View -My Donations</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'view_requests'%}"><i class="bi bi-chat-dots-fill"></i> View Requests</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'donor_feedback'%}"><i class="bi bi-chat-dots-fill"></i> Feedback</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Welcome, {{donor.username}}</h1>
                    <a href="{% url 'donor_logout' %}">
                        <button class="btn btn-light">Logout</button>
                    </a>
                </div>
                <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
                    <h3 class="text-center">YOUR BLOOD_GROUP - {{donor.blood_group}}</h3>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.js"></script>
</body>
</html>
